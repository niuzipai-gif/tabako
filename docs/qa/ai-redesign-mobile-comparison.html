<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tabako mobile comparison</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background: #dedbd5;
      color: #171612;
      font: 14px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    }
    main {
      display: grid;
      grid-template-columns: repeat(2, 390px);
      gap: 20px;
      width: max-content;
      margin: 0 auto;
    }
    figure { margin: 0; }
    figcaption {
      margin-bottom: 10px;
      font-weight: 700;
    }
    img {
      display: block;
      width: 390px;
      height: 844px;
      border-radius: 24px;
      box-shadow: 0 18px 50px rgba(28, 24, 18, 0.18);
      object-fit: cover;
    }
  </style>
</head>
<body>
  <main>
    <figure>
      <figcaption>改版前 · 原线上首屏</figcaption>
      <img src="./ai-redesign-source-mobile-viewport.png" alt="改版前手机端首屏" />
    </figure>
    <figure>
      <figcaption>改版后 · 图片优先与 AI 入口</figcaption>
      <img src="./ai-redesign-mobile.png" alt="改版后手机端首屏" />
    </figure>
  </main>
</body>
</html>
