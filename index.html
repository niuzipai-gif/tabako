<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>日本热门香烟价格汇总 | タバコ価格ガイド</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="bg-blur bg-blur-1"></div>
  <div class="bg-blur bg-blur-2"></div>

  <main class="container">
    <header class="hero glass">
      <p class="eyebrow">タバコ価格ガイド · たばこ価格まとめ</p>
      <h1>日本热门香烟与电子烟/烟弹价格汇总</h1>
      <p class="subtitle">
        所有价格以日元（JPY）为主，人民币价格（CNY）根据实时汇率自动换算显示在下方括号内。
      </p>
      <div class="meta">
        <span id="rateText">汇率加载中...</span>
        <span id="updatedText"></span>
      </div>
    </header>

    <section class="toolbar glass">
      <div class="toolbar-top">
        <div class="search-wrap">
          <label class="search-label" for="searchInput">搜索款式</label>
          <input id="searchInput" class="search-input" type="search" placeholder="输入日文、中文、品牌或口味，例如：万宝路 / メビウス / 薄荷" />
        </div>
        <p id="resultSummary" class="result-summary">共 0 款</p>
      </div>
      <div class="tab-row">
        <button class="tab-btn active" data-tab="all">全部</button>
        <button class="tab-btn" data-tab="cigarette">传统香烟</button>
        <button class="tab-btn" data-tab="heated">加热不燃烧</button>
        <button class="tab-btn" data-tab="device">IQOS机器本体</button>
        <button class="tab-btn" data-tab="pod">电子烟与烟弹</button>
      </div>
    </section>

    <section id="cards" class="cards"></section>
    <section id="emptyState" class="empty-state glass hidden">
      <p class="empty-title">没有找到匹配款式</p>
      <p class="empty-text">可以试试品牌名、日文名、中文名、口味或类别关键词。</p>
    </section>
  </main>

  <template id="cardTemplate">
    <article class="card glass" data-type="">
      <img class="product-image" src="" alt="" loading="lazy" />
      <div class="card-content">
        <div class="names">
          <h2 class="jp-name"></h2>
          <p class="cn-name"></p>
        </div>
        <div class="price-box">
          <p class="jpy-price"></p>
          <p class="cny-price"></p>
        </div>
        <span class="tag"></span>
        <p class="img-credit"></p>
      </div>
    </article>
  </template>

  <script src="./app.js"></script>
</body>
</html>
