name: Deploy MiniMax AI Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "worker.js"
      - "ai-client.js"
      - "catalog.js"
      - "data/products.js"
      - "wrangler.toml"
      - ".github/workflows/deploy-ai-worker.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check deployment secrets
        id: secrets
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$MINIMAX_API_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping AI Worker deploy because CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, or MINIMAX_API_KEY is not configured."
          fi
      - run: npm test
        if: steps.secrets.outputs.ready == 'true'
      - name: Store MiniMax secret
        if: steps.secrets.outputs.ready == 'true'
        run: printf '%s' "$MINIMAX_API_KEY" | npx wrangler secret put MINIMAX_API_KEY
      - name: Deploy Worker
        if: steps.secrets.outputs.ready == 'true'
        run: npx wrangler deploy
