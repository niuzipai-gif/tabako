name: Deploy MiniMax AI Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "worker.js"
      - "ai-client.js"
      - "catalog.js"
      - "data/products.js"
      - "wrangler.toml"
      - ".github/workflows/deploy-ai-worker.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify required deployment secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$MINIMAX_API_KEY"
      - run: npm test
      - name: Store MiniMax secret
        run: printf '%s' "$MINIMAX_API_KEY" | npx wrangler secret put MINIMAX_API_KEY
      - name: Deploy Worker
        run: npx wrangler deploy
